name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

  detect-version:
    name: Detect version change
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
      tag_exists: ${{ steps.tag.outputs.exists }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check crate version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          with open("Cargo.toml", "rb") as f:
              current = tomllib.load(f)["package"]["version"]

          before = os.environ["BEFORE"]

          try:
              previous_toml = subprocess.check_output(
                  ["git", "show", f"{before}:Cargo.toml"]
              )
              previous = tomllib.loads(previous_toml.decode())["package"]["version"]
          except (subprocess.CalledProcessError, KeyError):
              previous = ""

          changed = bool(previous) and current != previous

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version=v{current}\n")
              f.write(f"changed={str(changed).lower()}\n")

          print(f"Previous version: {previous}")
          print(f"Current version: {current}")
          print(f"Version changed: {changed}")
          PY

      - name: Check existing tag
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Build
        run: cargo build --release --locked --verbose

      - name: Rename binary
        run: cp target/release/floord-gui floord-gui-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: floord-gui-linux
          path: floord-gui-linux

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked --verbose

      - name: Rename binary
        shell: pwsh
        run: Copy-Item target/release/floord-gui.exe floord-gui-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: floord-gui-windows
          path: floord-gui-windows.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - detect-version
      - build-linux
      - build-windows

    if: >
      github.event_name == 'push' &&
      needs.detect-version.outputs.changed == 'true' &&
      needs.detect-version.outputs.tag_exists == 'false'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Floord GUI ${{ needs.detect-version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/floord-gui-linux
            dist/floord-gui-windows.exe
